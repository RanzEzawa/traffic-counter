name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Siapkan isi web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg www/

      - name: Buat proyek Android
        run: npx cap add android

      - name: Pasang kode native + pengaturan
        run: |
          PKG=android/app/src/main/java/com/ranzezawa/trafficcounter
          mkdir -p "$PKG"
          cp native/*.java "$PKG/"
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 29/' android/variables.gradle
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk traffic-counter.apk
          gh release create "v${{ github.run_number }}" traffic-counter.apk \
            --title "Traffic Counter v${{ github.run_number }}" \
            --notes "APK Android (butuh Android 10+). Unduh file traffic-counter.apk lalu pasang."
